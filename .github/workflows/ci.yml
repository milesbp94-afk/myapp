name: .NET CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore dependencies
        run: dotnet restore ./myapp/myapp.csproj

      - name: Build
        run: dotnet build ./myapp/myapp.csproj --configuration Release --no-restore

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore dependencies
        run: dotnet restore ./myapp/myapp.csproj

      - name: Test
        run: dotnet test ./myapp/myapp.csproj --configuration Release --no-restore --no-build

  run:
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore dependencies
        run: dotnet restore ./myapp/myapp.csproj

      - name: Build
        run: dotnet build ./myapp/myapp.csproj --configuration Release --no-restore

      - name: Run app
        run: dotnet run --project ./myapp/myapp.csproj --configuration Release --no-build
